name: Validate Agents Template Distribution

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  runtime-compatibility:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Run runtime compatibility test
        run: |
          python3 -m unittest tests.test_runtime_compatibility -v

  validate-distribution:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Validate rules directory structure
        run: |
          test -d rules/core || (echo "Error: rules/core missing" && exit 1)
          test -d rules/architecture || (echo "Error: rules/architecture missing" && exit 1)
          test -d rules/packaging || (echo "Error: rules/packaging missing" && exit 1)
          test -d rules/styles || (echo "Error: rules/styles missing" && exit 1)

      - name: Execute build and validate bundle
        run: |
          python3 scripts/build_dist.py
          python3 .agents/skills/rule-validator/scripts/validate_rules.py

      - name: Run full distribution tests
        run: |
          python3 -m unittest discover -s tests -v
