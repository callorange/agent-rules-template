name: Continuous Build & Release Agents Template

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate rules directory structure
        run: |
          echo "Validating rules/ core, architecture, packaging, and styles..."
          test -d rules/core || (echo "Error: rules/core missing" && exit 1)
          test -d rules/architecture || (echo "Error: rules/architecture missing" && exit 1)
          test -d rules/packaging || (echo "Error: rules/packaging missing" && exit 1)
          test -d rules/styles || (echo "Error: rules/styles missing" && exit 1)
          echo "Structure validation passed."

      - name: Verify dist bundle build
        run: |
          test -f dist/AGENTS.md || (echo "Error: dist/AGENTS.md missing" && exit 1)
          test -d dist/rules || (echo "Error: dist/rules missing" && exit 1)
          echo "Dist bundle verified successfully."

      - name: Create release zip artifact
        run: |
          cd dist && zip -r ../agents-template-dist.zip ./* && cd ..
          echo "Created agents-template-dist.zip"

      - name: Set Release Metadata
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: rel_meta
        run: |
          BUILD_DATE=$(date -u +'%Y-%m-%d %H:%M UTC')
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "release_name=Continuous Release ($BUILD_DATE - $SHORT_SHA)" >> $GITHUB_OUTPUT
          echo "build_date=$BUILD_DATE" >> $GITHUB_OUTPUT
          echo "short_sha=$SHORT_SHA" >> $GITHUB_OUTPUT

      - name: Create or Update GitHub Release on main push
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: ${{ steps.rel_meta.outputs.release_name }}
          body: |
            Automation release built directly from the `main` branch.
            
            - **Updated Date**: ${{ steps.rel_meta.outputs.build_date }}
            - **Commit SHA**: [${{ steps.rel_meta.outputs.short_sha }}](https://github.com/${{ github.repository }}/commit/${{ github.sha }})
            - **Contains**: Latest compiled `agents-template-dist.zip`
          files: |
            agents-template-dist.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
