name: Validate Agents Template Distribution

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  validate-distribution:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12', '3.13']
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Validate rules directory structure
        run: |
          echo "Validating rules/ core, architecture, packaging, and styles..."
          test -d rules/core || (echo "Error: rules/core missing" && exit 1)
          test -d rules/architecture || (echo "Error: rules/architecture missing" && exit 1)
          test -d rules/packaging || (echo "Error: rules/packaging missing" && exit 1)
          test -d rules/styles || (echo "Error: rules/styles missing" && exit 1)
          echo "Structure validation passed."

      - name: Execute build_dist.py assembly
        run: |
          python3 scripts/build_dist.py
          echo "Fresh canonical bundle compiled in CI."

      - name: Validate rules and dist bundle
        run: |
          python3 .agents/skills/rule-validator/scripts/validate_rules.py

      - name: Verify dist bundle build
        run: |
          test -f agent_rules_template/bundle/AGENTS.md || (echo "Error: bundle/AGENTS.md missing" && exit 1)
          test -d agent_rules_template/bundle/rules || (echo "Error: bundle/rules missing" && exit 1)
          test -f agent_rules_template/bundle/metadata.json || (echo "Error: bundle/metadata.json missing" && exit 1)
          echo "Bundle verified successfully."

      - name: Run distribution sync tests
        run: |
          python3 -m unittest discover -s tests -v
