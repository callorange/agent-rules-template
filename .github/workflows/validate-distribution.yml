name: Validate Distribution

on:
  push:
    branches:
      - main
    paths:
      - 'rules/**'
      - 'guides/**'
      - 'skills/**'
      - 'subagents/**'
      - '.agents/skills/rule-validator/**'
      - 'scripts/**'
      - 'agent_rules_template/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'AGENTS.md'
      - 'README.md'
      - 'CHANGELOG.md'
      - '.github/workflows/validate-distribution.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'rules/**'
      - 'guides/**'
      - 'skills/**'
      - 'subagents/**'
      - '.agents/skills/rule-validator/**'
      - 'scripts/**'
      - 'agent_rules_template/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'AGENTS.md'
      - 'README.md'
      - 'CHANGELOG.md'
      - '.github/workflows/validate-distribution.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-distribution:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Validate rules directory structure
        run: |
          test -d rules/core || (echo "Error: rules/core missing" && exit 1)
          test -d rules/architecture || (echo "Error: rules/architecture missing" && exit 1)
          test -d rules/packaging || (echo "Error: rules/packaging missing" && exit 1)
          test -d rules/styles || (echo "Error: rules/styles missing" && exit 1)

      - name: Execute build and validate bundle
        run: |
          python3 scripts/build_dist.py
          git diff --exit-code -- agent_rules_template/bundle
          python3 .agents/skills/rule-validator/scripts/validate_rules.py

      - name: Run full distribution tests
        run: |
          python3 -m unittest discover -s tests -v
